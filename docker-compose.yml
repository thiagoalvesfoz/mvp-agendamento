services:
  db:
    image: postgres:16-alpine
    container_name: agenda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agenda
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - agenda_pgdata:/var/lib/postgresql/data
      - ./prisma/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agenda"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agenda_pgdata:
